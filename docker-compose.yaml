# AI Smart Vending Machine - Docker Compose
# Base configuration (no hardware devices - for Windows compatibility)

services:
  # ============================================
  # IO Board Service (Port 8001)
  # Serial communication with LoadCell + DeadBolt
  # ============================================
  io_board:
    build:
      context: .
      dockerfile: docker/Dockerfile.io_board
    container_name: ai-vending-io-board
    ports:
      - "8001:8001"
    environment:
      - IO_BOARD_PORT=${IO_BOARD_PORT:-mock}
      - IO_BOARD_BAUDRATE=38400
      - IO_BOARD_MOCK_MODE=${IO_BOARD_MOCK_MODE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - ai-vending-network

  # ============================================
  # Model Service (Port 8002)
  # AI product judgment with YOLO + sensor fusion
  # ============================================
  model:
    build:
      context: .
      dockerfile: docker/Dockerfile.model.dev
    container_name: ai-vending-model
    ports:
      - "8002:8002"
    environment:
      - IO_BOARD_URL=http://io_board:8001
      - CAMERA_DRIVER_URL=http://camera_driver:8003
      - NODEJS_URL=http://node_server:8888
      - YOLO_MODEL_PATH=/app/models/siyeon_best.pt
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models:ro
      - ./data/snapshots:/app/data/snapshots
    depends_on:
      io_board:
        condition: service_healthy
      camera_driver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - ai-vending-network

  # ============================================
  # Camera Driver Service (Port 8003)
  # 6-camera management for Zone monitoring
  # ============================================
  camera_driver:
    build:
      context: .
      dockerfile: docker/Dockerfile.camera_driver
    container_name: ai-vending-camera
    ports:
      - "8003:8003"
    environment:
      - CAMERA_MODE=${CAMERA_MODE:-folder}
      - SNAPSHOT_FOLDER=/app/data/snapshots
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data/snapshots:/app/data/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-vending-network

  # ============================================
  # MQTT Client Service (Port 8006)
  # CHAI IF01-04 protocol
  # ============================================
  mqtt_client:
    build:
      context: .
      dockerfile: docker/Dockerfile.mqtt_client
    container_name: ai-vending-mqtt
    ports:
      - "8006:8006"
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-host.docker.internal}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - ai-vending-network

  # ============================================
  # Card Terminal Service (Port 8004, TCP 5000)
  # Payment terminal integration
  # ============================================
  card_terminal:
    build:
      context: .
      dockerfile: docker/Dockerfile.card_terminal
    container_name: ai-vending-card
    ports:
      - "8004:8004"
      - "5000:5000"
    environment:
      - MOCK_MODE=${MOCK_MODE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/status"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - ai-vending-network

  # ============================================
  # Node.js Orchestrator (Port 8888)
  # Main coordinator for all services
  # ============================================
  node_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: ai-vending-node
    ports:
      - "8888:8888"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - IO_BOARD_URL=http://io_board:8001
      - MODEL_URL=http://model:8002
      - CAMERA_URL=http://camera_driver:8003
      - CARD_TERMINAL_URL=http://card_terminal:8004
      - MQTT_CLIENT_URL=http://mqtt_client:8006
    depends_on:
      io_board:
        condition: service_healthy
      model:
        condition: service_healthy
      camera_driver:
        condition: service_healthy
      mqtt_client:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-vending-network

# ============================================
# Network Configuration
# ============================================
networks:
  ai-vending-network:
    driver: bridge
    name: ai-vending-network

# ============================================
# Volume Configuration (optional persistence)
# ============================================
volumes:
  model-data:
    name: ai-vending-model-data
  snapshot-data:
    name: ai-vending-snapshot-data
