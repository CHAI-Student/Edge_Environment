# AI Smart Vending Machine - Jetson Orin Nano Override
# GPU acceleration and hardware device mappings
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.jetson.yaml up -d

services:
  # ============================================
  # IO Board Service - Hardware Serial Port
  # ============================================
  io_board:
    devices:
      - /dev/ttyTHS0:/dev/ttyTHS0
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - IO_BOARD_PORT=/dev/ttyTHS0
      - IO_BOARD_MOCK_MODE=false
      - LOG_LEVEL=INFO

  # ============================================
  # Model Service - GPU Acceleration
  # ============================================
  model:
    build:
      context: .
      dockerfile: docker/Dockerfile.model
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_TENSORRT=true
      - TENSORRT_FP16=true
      - LOG_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================
  # Camera Driver - Hardware Cameras
  # ============================================
  camera_driver:
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    privileged: true
    environment:
      - CAMERA_MODE=hardware
      - V4L2_BUFFER_COUNT=4
      - CAMERA_RESOLUTION=640x480
      - LOG_LEVEL=INFO

  # ============================================
  # MQTT Client - Production Broker
  # ============================================
  mqtt_client:
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.1.10}
      - MQTT_BROKER_PORT=1883
      - LOG_LEVEL=INFO
    extra_hosts: []

  # ============================================
  # Card Terminal - Production Mode
  # ============================================
  card_terminal:
    environment:
      - MOCK_MODE=false
      - LOG_LEVEL=INFO

  # ============================================
  # Node Server - Production Mode
  # ============================================
  node_server:
    environment:
      - NODE_ENV=production

# ============================================
# Jetson Network Settings
# ============================================
networks:
  ai-vending-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
